name: Node.js CI

on:
  workflow_dispatch:
    inputs:
      playwright-version:
        description: 'Select Playwright Docker image version'
        required: true
        default: '1.56.0'
        type: choice
        options:
          - '1.63.0'
          - '1.55.0'
          - '1.54.2'
          - '1.53.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04

    container:
      image: mcr.microsoft.com/playwright:v${{ inputs.playwright-version }}-jammy

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Check Node and npm versions
        run: |
          node --version
          npm --version
          which node

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: allure-report

  deploy:
    name: Run Playwright Tests
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04

    steps:
      - name: Download Allure report artifact
        uses: actions/download-artifact@v5
        with:
          name: allure-report
          path: allure-report

      - name: Upload report to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
